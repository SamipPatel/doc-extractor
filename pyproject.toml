[project]
name = "doc-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samip Patel", email = "samipapatel@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
]

[project.scripts]
doc-extractor = "doc_extractor:main"
doc-extractor-eval = "evals.runner:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/doc_extractor is the product; evals/ is a repo-root harness shipped in the
# same wheel so `python -m evals` and the console script both import cleanly.
[tool.hatch.build.targets.wheel]
packages = ["src/doc_extractor", "evals"]
