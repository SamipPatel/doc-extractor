[project]
name = "doc-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samip Patel", email = "samipapatel@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
]

[project.scripts]
