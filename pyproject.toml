[project]
name = "doc-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samip Patel", email = "samipapatel@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "uvicorn>=0.34.0",
]

[project.scripts]
doc-extractor = "doc_extractor:main"
doc-extractor-eval = "evals.runner:main"
doc-extractor-lab = "web.app:main"

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/doc_extractor is the product; evals/ is the harness; web/ is the lab UI.
[tool.hatch.build.targets.wheel]
packages = ["src/doc_extractor", "evals", "web"]

[tool.hatch.build.targets.wheel.force-include]
"web/static" = "web/static"
